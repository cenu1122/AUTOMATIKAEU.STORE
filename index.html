<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Arduino Industrial Shop</title>

<style>
:root{--teal:#008184;--dark:#273b47;--orange:#d35400;--bg:#f4f7f6;}
body{font-family:Segoe UI;margin:0;background:var(--bg);}
nav{background:var(--dark);padding:10px 5%;display:flex;justify-content:space-between;position:fixed;width:90%;z-index:2000;}
.lang-switcher button{background:#444;color:white;border:none;padding:6px 12px;margin-left:5px;cursor:pointer}
.lang-switcher button.active{background:var(--teal)}
header{background:linear-gradient(rgba(0,129,132,.8),rgba(39,59,71,.9)),url('https://images.unsplash.com/photo-1518770660439-4636190af475');background-size:cover;padding:160px 20px;text-align:center;color:white}
.container{padding:70px 5%}
.shop-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:25px}
.card{background:white;border-radius:12px;padding:20px;text-align:center;box-shadow:0 4px 8px rgba(0,0,0,.06);transition:.3s}
.card:hover{transform:translateY(-6px) scale(1.02)}
.card img{width:100%;height:150px;object-fit:contain}
.price{color:var(--orange);font-weight:bold;font-size:20px;margin:10px 0}
.btn{display:block;margin-top:8px;padding:10px;border-radius:8px;text-decoration:none;color:white;font-weight:bold}
.buy{background:#25D366}
.cart{background:var(--teal)}
.paypal{background:#0070ba}
#cartBox{position:fixed;right:20px;bottom:20px;background:white;padding:15px;border-radius:10px;box-shadow:0 5px 15px rgba(0,0,0,.2);width:260px}
</style>
</head>

<body>

<nav>
<div>Arduino Shop</div>
<div class="lang-switcher">
<button onclick="changeLang('bs')" id="lang-bs" class="active">BS</button>
<button onclick="changeLang('en')" id="lang-en">EN</button>
<button onclick="changeLang('de')" id="lang-de">DE</button>
</div>
</nav>

<header>
<h1>Arduino Industrial Shop</h1>
</header>

<div class="container">
<div class="shop-grid" id="grid"></div>
</div>

<div id="cartBox">
<b>🛒 Korpa</b>
<div id="cartItems"></div>
<b id="total">0 KM</b>
</div>

<script>
const items=[
{name:"Arduino Uno R3",price:15,img:"https://www.arduino.cc/en/uploads/Main/A000066_iso_front.jpg"},
{name:"Arduino Mega 2560",price:25,img:"https://www.arduino.cc/en/uploads/Main/A000067_iso_front.jpg"},
{name:"Arduino Nano",price:10,img:"https://m.media-amazon.com/images/I/61m1hI4-qjL._SL1000_.jpg"},
{name:"ESP32",price:12,img:"https://m.media-amazon.com/images/I/61NfI7z3SXL._SL1000_.jpg"},
{name:"NodeMCU",price:9,img:"https://m.media-amazon.com/images/I/61I2MlsS89L._SL1000_.jpg"},
{name:"Raspberry Pico",price:14,img:"https://www.raspberrypi.com/app/uploads/2021/01/Pico-Hero.jpg"}
];

let cart=[];
let lang="bs";

function load(){
grid.innerHTML="";
items.forEach(i=>{
grid.innerHTML+=`
<div class="card">
<img src="${i.img}">
<h4>${i.name}</h4>
<div class="price">${i.price} KM</div>
<a class="btn buy" href="https://wa.me/38761000000?text=Narucujem ${i.name}">WhatsApp</a>
<button class="btn cart" onclick="addCart('${i.name}',${i.price})">Dodaj u korpu</button>
<a class="btn paypal" href="#">PayPal</a>
</div>`;
});
}

function addCart(name,price){
cart.push({name,price});
renderCart();
}

function renderCart(){
cartItems.innerHTML="";
let t=0;
cart.forEach(i=>{cartItems.innerHTML+=i.name+"<br>";t+=i.price;});
total.innerText=t+" KM";
}

function changeLang(l){
lang=l;
document.querySelectorAll(".lang-switcher button").forEach(b=>b.classList.remove("active"));
document.getElementById("lang-"+l).classList.add("active");
}

load();
</script>

</body>
</html>
