<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<title>DE → BS Realtime Prevodilac</title>
<style>
body {
    font-family: Arial;
    background: #f0f2f5;
    text-align: center;
    padding: 40px;
}
.container {
    background: white;
    padding: 30px;
    border-radius: 12px;
    max-width: 700px;
    margin: auto;
    box-shadow: 0 0 20px rgba(0,0,0,0.1);
}
textarea {
    width: 100%;
    height: 100px;
    margin-top: 10px;
}
input {
    width: 100%;
    padding: 10px;
    margin-bottom: 10px;
}
button {
    padding: 10px 20px;
    margin: 5px;
    cursor: pointer;
}
.status {
    margin-top: 10px;
    font-weight: bold;
}
</style>
</head>
<body>

<div class="container">
<h2>🎤 Njemački → Bosanski (Real-Time)</h2>

<input type="password" id="apiKey" placeholder="Unesi svoj OpenAI API ključ">

<button onclick="startListening()">▶ START</button>
<button onclick="stopListening()">⏹ STOP</button>

<div class="status" id="status">Status: Neaktivno</div>

<h3>Njemački:</h3>
<textarea id="germanText"></textarea>

<h3>Bosanski:</h3>
<textarea id="bosnianText"></textarea>

</div>

<script>
let recognition;
let isListening = false;
let isSpeaking = false;

function startListening() {
    const apiKey = document.getElementById("apiKey").value;
    if (!apiKey) {
        alert("Unesi API ključ!");
        return;
    }

    recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
    recognition.lang = "de-DE";
    recognition.continuous = true;
    recognition.interimResults = false;

    recognition.onstart = () => {
        isListening = true;
        document.getElementById("status").innerText = "Status: Slušam...";
    };

    recognition.onresult = async function(event) {
        if (isSpeaking) return;

        const transcript = event.results[event.results.length - 1][0].transcript;
        document.getElementById("germanText").value = transcript;

        await translateText(transcript, apiKey);
    };

    recognition.onend = () => {
        if (isListening) recognition.start();
    };

    recognition.start();
}

function stopListening() {
    if (recognition) {
        isListening = false;
        recognition.stop();
    }
    document.getElementById("status").innerText = "Status: Zaustavljeno";
}

async function translateText(text, apiKey) {
    const response = await fetch("https://api.openai.com/v1/chat/completions", {
        method: "POST",
        headers: {
            "Content-Type": "application/json",
            "Authorization": "Bearer " + apiKey
        },
        body: JSON.stringify({
            model: "gpt-4o-mini",
            messages: [
                { role: "system", content: "Prevedi sa njemačkog na bosanski prirodno i jasno." },
                { role: "user", content: text }
            ]
        })
    });

    const data = await response.json();
    const translated = data.choices[0].message.content;

    document.getElementById("bosnianText").value = translated;
    speak(translated);
}

function speak(text) {
    isSpeaking = true;
    const utterance = new SpeechSynthesisUtterance(text);
    utterance.lang = "bs-BA";

    utterance.onend = () => {
        isSpeaking = false;
    };

    window.speechSynthesis.speak(utterance);
}
</script>

</body>
</html>
