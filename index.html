<!DOCTYPE html>
<html lang="bs">
<head>
<meta charset="UTF-8">
<title>Voice Listener - Virtual Cable</title>
<style>
body { font-family: Arial; background:#f0f2f5; text-align:center; padding:40px; }
.container { background:white; padding:30px; border-radius:12px; max-width:700px; margin:auto; box-shadow:0 0 20px rgba(0,0,0,0.1); }
textarea { width:100%; height:150px; margin-top:10px; }
button { padding:10px 20px; margin:5px; cursor:pointer; }
.status { margin-top:10px; font-weight:bold; color:blue; }
</style>
</head>
<body>

<div class="container">
<h2>🎙 Audio Listener preko Virtual Cable</h2>

<button onclick="startListening()">▶ START slušanja</button>
<button onclick="stopListening()">⏹ STOP</button>

<div class="status" id="status">Status: Neaktivno</div>

<h3>Prepoznati tekst:</h3>
<textarea id="recognizedText"></textarea>
</div>

<script>
let recognition;
let isListening = false;

async function startListening() {
    // Chrome automatski traži dozvolu za mikrofon
    try {
        recognition = new (window.SpeechRecognition || window.webkitSpeechRecognition)();
        recognition.lang = "bs-BA"; // možeš promijeniti
        recognition.continuous = true;
        recognition.interimResults = true;

        recognition.onstart = () => {
            isListening = true;
            document.getElementById("status").innerText = "Status: Slušam audio sa virtualnog kabla...";
        };

        recognition.onresult = (event) => {
            let transcript = "";
            for (let i = event.resultIndex; i < event.results.length; i++) {
                transcript += event.results[i][0].transcript;
            }
            document.getElementById("recognizedText").value = transcript;
        };

        recognition.onend = () => {
            if (isListening) recognition.start(); // automatski restart
        };

        recognition.start();

    } catch (err) {
        console.error(err);
        document.getElementById("status").innerText = "Greška: dozvoli mikrofon u Chrome-u!";
    }
}

function stopListening() {
    if (recognition) { isListening = false; recognition.stop(); }
    document.getElementById("status").innerText = "Status: Zaustavljeno";
}
</script>

</body>
</html>
